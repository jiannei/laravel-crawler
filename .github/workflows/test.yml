name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: P${{ matrix.php }} - L${{ matrix.laravel }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: [8.4, 8.5]
        laravel: [13.*]
        include:
          - laravel: 13.*
            testbench: 11.*
            phpunit: ^13.0
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, mbstring, zip, pcntl, sqlite, pdo_sqlite, iconv, dom
          coverage: none
          tools: composer:v2
          cache: composer

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies - L${{ matrix.laravel }}
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" "phpunit/phpunit:${{ matrix.phpunit }}" --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Audit dependencies
        run: composer audit

      - name: Execute tests
        run: vendor/bin/phpunit

  integration:
    name: Integration (network)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          extensions: curl, mbstring, zip, pcntl, sqlite, pdo_sqlite, iconv, dom
          coverage: none
          tools: composer:v2
          cache: composer

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Execute integration tests
        run: vendor/bin/phpunit --group integration

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          coverage: none
          tools: composer:v2
          cache: composer

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run Pint
        run: vendor/bin/pint --test
